name: Deploy Twinevia Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch the live checkout should track for this deploy
        required: false
        default: main
      deploy_tracking:
        description: Tracking ref the live checkout must use
        required: false
        default: origin/main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TWINEVIA_DEPLOY_BRANCH: ${{ vars.TWINEVIA_DEPLOY_BRANCH }}
  TWINEVIA_DEPLOY_TRACKING: ${{ vars.TWINEVIA_DEPLOY_TRACKING }}

permissions:
  contents: read

concurrency:
  group: deploy-twinevia-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run baseline quality gate
        run: |
          ./run/verify.sh

      - name: Bootstrap project venv
        run: |
          ./run/setup.sh

      - name: Run documented CLI smoke checks
        run: |
          ./run/doc_smoke.sh

      - name: Run test suite
        run: |
          ./run/test.sh -q

      - name: Install isolated browser test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-server

      - name: Run browser regression suite
        run: |
          ./run/test_browser.sh

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write SSH key + known_hosts
        env:
          TWINEVIA_SSH_KEY: ${{ secrets.TWINEVIA_SSH_KEY }}
          TWINEVIA_SSH_KNOWN_HOSTS: ${{ secrets.TWINEVIA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          SSH_KEY_VALUE="${TWINEVIA_SSH_KEY:-}"
          if [ -z "${SSH_KEY_VALUE}" ]; then
            echo "❌ missing TWINEVIA_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY_VALUE}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          KNOWN_HOSTS_VALUE="${TWINEVIA_SSH_KNOWN_HOSTS:-}"
          if [ -z "${KNOWN_HOSTS_VALUE}" ]; then
            echo "❌ missing TWINEVIA_SSH_KNOWN_HOSTS"
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS_VALUE}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create encrypted pre-deployment backup export
        env:
          TWINEVIA_SSH_TARGET: ${{ secrets.TWINEVIA_SSH_TARGET }}
          TWINEVIA_SSH_PORT: ${{ vars.TWINEVIA_SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT_VALUE="${TWINEVIA_SSH_PORT:-22}"
          SSH_TARGET_VALUE="${TWINEVIA_SSH_TARGET:-}"
          if [ -z "${SSH_TARGET_VALUE}" ]; then
            echo "missing TWINEVIA_SSH_TARGET" >&2
            exit 1
          fi

          BACKUP_SCRIPT_REMOTE="/tmp/twinevia-backup-${GITHUB_RUN_ID}.sh"
          PREPARE_SCRIPT_REMOTE="/tmp/twinevia-prepare-backup-${GITHUB_RUN_ID}.sh"
          CONFIRM_SCRIPT_REMOTE="/tmp/twinevia-confirm-backup-${GITHUB_RUN_ID}.sh"
          EXPORT_DIR_REMOTE="/tmp/twinevia-backup-export-${GITHUB_RUN_ID}"
          SSH_OPTIONS=(-p "${SSH_PORT_VALUE}" -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP_OPTIONS=(-P "${SSH_PORT_VALUE}" -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          scp "${SCP_OPTIONS[@]}" deploy/backup_twinevia_saas.sh "${SSH_TARGET_VALUE}:${BACKUP_SCRIPT_REMOTE}"
          scp "${SCP_OPTIONS[@]}" deploy/prepare_github_backup_export.sh "${SSH_TARGET_VALUE}:${PREPARE_SCRIPT_REMOTE}"
          scp "${SCP_OPTIONS[@]}" deploy/confirm_github_backup.sh "${SSH_TARGET_VALUE}:${CONFIRM_SCRIPT_REMOTE}"
          REMOTE_USER="$(ssh "${SSH_OPTIONS[@]}" "${SSH_TARGET_VALUE}" id -un)"
          ssh "${SSH_OPTIONS[@]}" "${SSH_TARGET_VALUE}" \
            sudo -n APP_ROOT=/opt/twinevia-saas \
              TWINEVIA_ENV_FILE=/opt/twinevia-saas/.env \
              APP_GROUP=twinevia \
              bash "${PREPARE_SCRIPT_REMOTE}" \
              --backup-script "${BACKUP_SCRIPT_REMOTE}" \
              --export-dir "${EXPORT_DIR_REMOTE}" \
              --export-owner "${REMOTE_USER}"

          mkdir -p output/production-backup
          scp -r "${SCP_OPTIONS[@]}" "${SSH_TARGET_VALUE}:${EXPORT_DIR_REMOTE}" output/production-backup/

      - name: Upload encrypted off-host backup
        uses: actions/upload-artifact@v4
        with:
          name: twinevia-production-backup-${{ github.run_id }}
          path: output/production-backup/**
          if-no-files-found: error
          retention-days: 35

      - name: Confirm off-host backup proof
        env:
          TWINEVIA_SSH_TARGET: ${{ secrets.TWINEVIA_SSH_TARGET }}
          TWINEVIA_SSH_PORT: ${{ vars.TWINEVIA_SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT_VALUE="${TWINEVIA_SSH_PORT:-22}"
          SSH_TARGET_VALUE="${TWINEVIA_SSH_TARGET:-}"
          CONFIRM_SCRIPT_REMOTE="/tmp/twinevia-confirm-backup-${GITHUB_RUN_ID}.sh"
          ssh -p "${SSH_PORT_VALUE}" \
            -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET_VALUE}" \
            sudo -n APP_GROUP=twinevia bash "${CONFIRM_SCRIPT_REMOTE}" \
              --status-file /var/lib/twinevia-saas/backup-status.json \
              --repository "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}" \
              --artifact-name "twinevia-production-backup-${GITHUB_RUN_ID}"

      - name: Deploy
        env:
          WORKFLOW_DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch }}
          WORKFLOW_DEPLOY_TRACKING: ${{ github.event.inputs.deploy_tracking }}
          TWINEVIA_SSH_TARGET: ${{ secrets.TWINEVIA_SSH_TARGET }}
          TWINEVIA_SSH_PORT: ${{ vars.TWINEVIA_SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT_VALUE="${TWINEVIA_SSH_PORT:-22}"
          REQUIRED_BRANCH="${WORKFLOW_DEPLOY_BRANCH:-${TWINEVIA_DEPLOY_BRANCH:-main}}"
          REQUIRED_TRACKING="${WORKFLOW_DEPLOY_TRACKING:-${TWINEVIA_DEPLOY_TRACKING:-origin/${REQUIRED_BRANCH}}}"
          SSH_TARGET_VALUE="${TWINEVIA_SSH_TARGET:-}"

          if [ -z "${SSH_TARGET_VALUE}" ]; then
            echo "❌ missing TWINEVIA_SSH_TARGET"
            exit 1
          fi

          echo "==> Production deploy source"
          echo "Branch: ${REQUIRED_BRANCH}"
          echo "Tracking: ${REQUIRED_TRACKING}"
          echo "SSH target: ${SSH_TARGET_VALUE}"

          ssh -p "${SSH_PORT_VALUE}" \
            -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET_VALUE}" bash -s -- "${REQUIRED_BRANCH}" "${REQUIRED_TRACKING}" "${GITHUB_SHA}" <<'REMOTE'
          set -euo pipefail

          REQUIRED_BRANCH="$1"
          REQUIRED_TRACKING="$2"
          EXPECTED_SHA="$3"
          APP_ROOT="${APP_ROOT:-/opt/twinevia-saas}"
          APP_USER="${APP_USER:-twinevia}"
          TWINEVIA_SAAS_DBDOCTOR_BIN="/usr/local/bin/twinevia-saas-dbdoctor"
          TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN="/usr/local/bin/saas-dbdoctor"

          fail() {
            echo "❌ $1" >&2
            exit 1
          }

          resolve_app_user() {
            if [ -n "${APP_USER}" ]; then
              printf '%s\n' "${APP_USER}"
              return
            fi
            if id -u twinevia >/dev/null 2>&1; then
              printf 'twinevia\n'
              return
            fi
            printf 'twinevia\n'
          }

          resolve_app_root() {
            local active_root
            if [ -n "${APP_ROOT}" ]; then
              printf '%s\n' "${APP_ROOT}"
              return
            fi
            active_root="$(systemctl show twinevia-saas.service -p WorkingDirectory --value 2>/dev/null || true)"
            if [ -n "${active_root}" ] && [ -d "${active_root}/.git" ]; then
              printf '%s\n' "${active_root}"
              return
            fi
            if [ -d /opt/twinevia-saas/.git ]; then
              printf '/opt/twinevia-saas\n'
              return
            fi
            printf '/opt/twinevia-saas\n'
          }

          echo "==> Production preflight"
          APP_ROOT="$(resolve_app_root)"
          APP_USER="$(resolve_app_user)"
          [ -d "${APP_ROOT}" ] || fail "${APP_ROOT} does not exist. Run deploy/install_saas.sh manually first."
          [ -f "${APP_ROOT}/.env" ] || fail "${APP_ROOT}/.env is missing."
          sudo -u "${APP_USER}" test -d "${APP_ROOT}/.git" || fail "${APP_ROOT} is not a git checkout."
          sudo -u "${APP_USER}" git -C "${APP_ROOT}" diff --quiet || fail "${APP_ROOT} has uncommitted tracked changes."
          sudo -u "${APP_USER}" git -C "${APP_ROOT}" diff --cached --quiet || fail "${APP_ROOT} has staged changes."

          CURRENT_BRANCH="$(sudo -u "${APP_USER}" git -C "${APP_ROOT}" rev-parse --abbrev-ref HEAD)"
          [ "${CURRENT_BRANCH}" = "${REQUIRED_BRANCH}" ] || fail "${APP_ROOT} is on ${CURRENT_BRANCH}, expected ${REQUIRED_BRANCH}."

          TRACKING_BRANCH="$(sudo -u "${APP_USER}" git -C "${APP_ROOT}" rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
          [ "${TRACKING_BRANCH}" = "${REQUIRED_TRACKING}" ] || fail "${APP_ROOT} tracks ${TRACKING_BRANCH:-<none>}, expected ${REQUIRED_TRACKING}."

          sudo -u "${APP_USER}" git -C "${APP_ROOT}" fetch --prune origin
          REMOTE_TRACKING_SHA="$(sudo -u "${APP_USER}" git -C "${APP_ROOT}" rev-parse "${REQUIRED_TRACKING}")"
          [ "${REMOTE_TRACKING_SHA}" = "${EXPECTED_SHA}" ] || fail "${REQUIRED_TRACKING} is ${REMOTE_TRACKING_SHA}, expected workflow commit ${EXPECTED_SHA}."

          if [ -x "${TWINEVIA_SAAS_DBDOCTOR_BIN}" ]; then
            ACTIVE_DBDOCTOR_BIN="${TWINEVIA_SAAS_DBDOCTOR_BIN}"
          elif [ -x "${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}" ]; then
            ACTIVE_DBDOCTOR_BIN="${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}"
          else
            fail "${TWINEVIA_SAAS_DBDOCTOR_BIN} is missing. Run deploy/install_saas.sh manually first."
          fi

          for unit in \
            twinevia-saas.service \
            twinevia-saas-worker.service \
            twinevia-saas-scheduler.timer \
            twinevia-saas-billing-reconcile.timer \
            twinevia-saas-platform-restart-queue.timer \
            twinevia-saas-a2p-reconcile.timer; do
            systemctl list-unit-files "${unit}" --no-legend | grep -q "^${unit}[[:space:]]" || fail "Missing systemd unit ${unit}. Run deploy/install_saas.sh manually first."
          done

          for key in \
            DATABASE_URL \
            SAAS_BASE_URL \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET \
            STRIPE_PRICE_ID \
            TWILIO_ACCOUNT_SID \
            TWILIO_AUTH_TOKEN \
            TWILIO_CREDENTIAL_ENCRYPTION_KEY \
            SECRET_KEY \
            TRUSTED_HOSTS; do
            sudo grep -q "^${key}=" "${APP_ROOT}/.env" || fail "Missing ${key} in ${APP_ROOT}/.env"
          done

          DBDOCTOR_APP_ROOT="${APP_ROOT}/current"
          if [ ! -x "${DBDOCTOR_APP_ROOT}/venv/bin/python" ]; then
            DBDOCTOR_APP_ROOT="${APP_ROOT}"
          fi
          [ -x "${DBDOCTOR_APP_ROOT}/venv/bin/python" ] || fail "Python is missing from both the active release and the legacy bootstrap root."
          sudo -u "${APP_USER}" bash -lc "set -euo pipefail; cd \"${DBDOCTOR_APP_ROOT}\"; set -a; source \"${APP_ROOT}/.env\"; set +a; TWINEVIA_SAAS_APP_ROOT=\"${DBDOCTOR_APP_ROOT}\" \"${ACTIVE_DBDOCTOR_BIN}\" --doctor" >/dev/null

          echo "==> Refresh deploy tooling from repo"
          sudo -u "${APP_USER}" bash -lc "cd \"${APP_ROOT}\" && git pull --ff-only"
          sudo install -m 0755 "${APP_ROOT}/deploy/deploy_twinevia_saas.sh" /usr/local/bin/deploy_twinevia_saas.sh
          sudo install -m 0755 "${APP_ROOT}/bin/twinevia-saas-dbdoctor" "${TWINEVIA_SAAS_DBDOCTOR_BIN}"
          sudo install -m 0755 "${APP_ROOT}/bin/saas-dbdoctor" "${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}"

          echo "==> Install and verify Twinevia Nginx virtual hosts"
          sudo bash "${APP_ROOT}/deploy/install_nginx_twinevia.sh" --confirm-dns-and-certificate-ready

          echo "==> Deploy latest branch"
          sudo EXPECTED_GIT_BRANCH="${REQUIRED_BRANCH}" EXPECTED_GIT_TRACKING_BRANCH="${REQUIRED_TRACKING}" APP_ROOT="${APP_ROOT}" APP_USER="${APP_USER}" /usr/local/bin/deploy_twinevia_saas.sh

          echo "==> Service assertions"
          sudo systemctl is-active --quiet twinevia-saas
          sudo systemctl is-active --quiet twinevia-saas-worker
          sudo systemctl is-active --quiet twinevia-saas-scheduler.timer
          sudo systemctl is-active --quiet twinevia-saas-billing-reconcile.timer
          sudo systemctl is-active --quiet twinevia-saas-platform-restart-queue.timer
          sudo systemctl is-active --quiet twinevia-saas-a2p-reconcile.timer
          sudo systemctl is-active --quiet twinevia-saas-backup.timer
          sudo systemctl is-active --quiet twinevia-saas-readiness.timer

          echo "==> Restart helper smoke check"
          sudo -u "${APP_USER}" sudo -n /usr/local/bin/restart-twinevia-saas-services --check >/dev/null

          echo "==> Health check"
          HEALTH_HOST="app.twinevia.com"
          echo "Internal health host: ${HEALTH_HOST}"
          HEALTH_RESPONSE=""
          for attempt in $(seq 1 15); do
            HEALTH_RESPONSE="$(curl -fsS --connect-timeout 2 --max-time 5 -H "Host: ${HEALTH_HOST}" http://127.0.0.1:8100/health 2>/dev/null || true)"
            if [ "${HEALTH_RESPONSE}" = "OK" ]; then
              break
            fi
            echo "Health attempt ${attempt}/15 did not return OK; retrying."
            sleep 2
          done
          [ "${HEALTH_RESPONSE}" = "OK" ] || fail "Health endpoint did not return OK after 15 attempts."
          READINESS_TOKEN_VALUE="$(sudo awk -F= '$1 == "READINESS_TOKEN" { value = substr($0, index($0, "=") + 1) } END { print value }' "${APP_ROOT}/.env")"
          READY_RESPONSE=""
          for attempt in $(seq 1 15); do
            READY_RESPONSE="$(curl -fsS --connect-timeout 2 --max-time 10 -H "Host: ${HEALTH_HOST}" -H "X-Twinevia-Readiness-Token: ${READINESS_TOKEN_VALUE}" http://127.0.0.1:8100/ready 2>/dev/null || true)"
            if [ "${READY_RESPONSE}" = "READY" ]; then
              break
            fi
            echo "Readiness attempt ${attempt}/15 did not return READY; retrying."
            sleep 2
          done
          [ "${READY_RESPONSE}" = "READY" ] || fail "Readiness endpoint did not return READY after 15 attempts."
          CURRENT_RELEASE="$(readlink -f "${APP_ROOT}/current")"
          RELEASE_SHA="$(sudo awk -F= '$1 == "APP_RELEASE_SHA" { print substr($0, index($0, "=") + 1) }' "${CURRENT_RELEASE}/.release.env")"
          [ "${RELEASE_SHA}" = "${EXPECTED_SHA}" ] || fail "Active release ${RELEASE_SHA} does not match workflow commit ${EXPECTED_SHA}."

          echo "==> External host and product identity checks"
          EXTERNAL_HEALTH=""
          for attempt in $(seq 1 15); do
            EXTERNAL_HEALTH="$(curl -fsS --connect-timeout 3 --max-time 15 https://app.twinevia.com/health 2>/dev/null || true)"
            if [ "${EXTERNAL_HEALTH}" = "OK" ]; then
              break
            fi
            echo "External health attempt ${attempt}/15 did not return OK; retrying."
            sleep 2
          done
          [ "${EXTERNAL_HEALTH}" = "OK" ] || fail "External health endpoint did not return OK after 15 attempts."
          EXTERNAL_READY=""
          for attempt in $(seq 1 15); do
            EXTERNAL_READY="$(curl -fsS --connect-timeout 3 --max-time 20 -H "X-Twinevia-Readiness-Token: ${READINESS_TOKEN_VALUE}" https://app.twinevia.com/ready 2>/dev/null || true)"
            if [ "${EXTERNAL_READY}" = "READY" ]; then
              break
            fi
            echo "External readiness attempt ${attempt}/15 did not return READY; retrying."
            sleep 2
          done
          [ "${EXTERNAL_READY}" = "READY" ] || fail "External readiness endpoint did not return READY after 15 attempts."
          PUBLIC_PAGE="$(curl -fsS --connect-timeout 3 --max-time 20 https://twinevia.com/)"
          [[ "${PUBLIC_PAGE}" == *"Automated survey flows"* ]] || fail "Public site is missing the automated survey flow feature."
          LOGIN_PAGE="$(curl -fsS --connect-timeout 3 --max-time 20 https://app.twinevia.com/login)"
          [[ "${LOGIN_PAGE}" == *"Twinevia"* ]] || fail "App login does not contain the Twinevia identity."
          [[ "${LOGIN_PAGE}" != *"Absolute Home Keeper"* ]] || fail "App host is serving the Absolute Home Keeper site."

          echo "✅ Twinevia production deploy complete and healthy"
          REMOTE

      - name: Clean remote backup export
        if: always()
        env:
          TWINEVIA_SSH_TARGET: ${{ secrets.TWINEVIA_SSH_TARGET }}
          TWINEVIA_SSH_PORT: ${{ vars.TWINEVIA_SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT_VALUE="${TWINEVIA_SSH_PORT:-22}"
          SSH_TARGET_VALUE="${TWINEVIA_SSH_TARGET:-}"
          if [ -z "${SSH_TARGET_VALUE}" ]; then
            exit 0
          fi
          ssh -p "${SSH_PORT_VALUE}" \
            -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET_VALUE}" \
            sudo -n rm -rf -- \
              "/tmp/twinevia-backup-export-${GITHUB_RUN_ID}" \
              "/tmp/twinevia-backup-${GITHUB_RUN_ID}.sh" \
              "/tmp/twinevia-prepare-backup-${GITHUB_RUN_ID}.sh" \
              "/tmp/twinevia-confirm-backup-${GITHUB_RUN_ID}.sh"

      - name: Open deployment incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TITLE="Twinevia production deployment failed"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING_NUMBER="$(gh issue list --state open --search "${TITLE} in:title" --json number,title --jq '.[] | select(.title == "'"${TITLE}"'") | .number' | head -n1)"
          if [ -n "${EXISTING_NUMBER}" ]; then
            gh issue comment "${EXISTING_NUMBER}" --body "Deployment failed again: ${RUN_URL}"
          else
            gh issue create --title "${TITLE}" --body "The production deployment workflow failed. Review ${RUN_URL} before retrying."
          fi
