name: Deploy Twinevia Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch the live checkout should track for this deploy
        required: false
        default: main
      deploy_tracking:
        description: Tracking ref the live checkout must use
        required: false
        default: origin/main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TWINEVIA_DEPLOY_BRANCH: ${{ vars.TWINEVIA_DEPLOY_BRANCH }}
  TWINEVIA_DEPLOY_TRACKING: ${{ vars.TWINEVIA_DEPLOY_TRACKING }}
  LEGACY_BETA_DEPLOY_BRANCH: ${{ vars.BETA_DEPLOY_BRANCH }}
  LEGACY_BETA_DEPLOY_TRACKING: ${{ vars.BETA_DEPLOY_TRACKING }}

concurrency:
  group: deploy-twinevia-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run baseline quality gate
        run: |
          ./run/verify.sh

      - name: Bootstrap project venv
        run: |
          ./run/setup.sh

      - name: Run documented CLI smoke checks
        run: |
          ./run/doc_smoke.sh

      - name: Run test suite
        run: |
          ./run/test.sh -q

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Write SSH key + known_hosts
        env:
          TWINEVIA_SSH_KEY: ${{ secrets.TWINEVIA_SSH_KEY }}
          TWINEVIA_SSH_KNOWN_HOSTS: ${{ secrets.TWINEVIA_SSH_KNOWN_HOSTS }}
          PILOT_VPS_HOST: ${{ secrets.PILOT_VPS_HOST }}
          PILOT_VPS_KNOWN_HOSTS: ${{ secrets.PILOT_VPS_KNOWN_HOSTS }}
          PILOT_VPS_SSH_KEY: ${{ secrets.PILOT_VPS_SSH_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          SSH_KEY_VALUE="${TWINEVIA_SSH_KEY:-}"
          if [ -z "${SSH_KEY_VALUE}" ] && [ -n "${PILOT_VPS_SSH_KEY:-${VPS_SSH_KEY:-}}" ]; then
            echo "::warning::Legacy SSH key secret in use; set TWINEVIA_SSH_KEY."
            SSH_KEY_VALUE="${PILOT_VPS_SSH_KEY:-${VPS_SSH_KEY:-}}"
          fi
          if [ -z "${SSH_KEY_VALUE}" ]; then
            echo "❌ missing TWINEVIA_SSH_KEY (or legacy fallback secret)"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY_VALUE}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          KNOWN_HOSTS_VALUE="${TWINEVIA_SSH_KNOWN_HOSTS:-}"
          if [ -z "${KNOWN_HOSTS_VALUE}" ] && [ -n "${PILOT_VPS_KNOWN_HOSTS:-}" ]; then
            echo "::warning::Legacy known-hosts secret in use; set TWINEVIA_SSH_KNOWN_HOSTS."
            KNOWN_HOSTS_VALUE="${PILOT_VPS_KNOWN_HOSTS:-}"
          fi
          if [ -z "${KNOWN_HOSTS_VALUE}" ]; then
            echo "❌ missing TWINEVIA_SSH_KNOWN_HOSTS (or legacy fallback secret)"
            exit 1
          fi
          printf '%s\n' "${KNOWN_HOSTS_VALUE}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          WORKFLOW_DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch }}
          WORKFLOW_DEPLOY_TRACKING: ${{ github.event.inputs.deploy_tracking }}
          TWINEVIA_SSH_TARGET: ${{ secrets.TWINEVIA_SSH_TARGET }}
          TWINEVIA_SSH_PORT: ${{ vars.TWINEVIA_SSH_PORT }}
          PILOT_VPS_HOST: ${{ secrets.PILOT_VPS_HOST }}
          PILOT_VPS_USER: ${{ secrets.PILOT_VPS_USER }}
          PILOT_VPS_PORT: ${{ secrets.PILOT_VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail

          VPS_USER_VALUE="${PILOT_VPS_USER:-${VPS_USER:-}}"
          VPS_PORT_VALUE="${TWINEVIA_SSH_PORT:-${PILOT_VPS_PORT:-${VPS_PORT:-22}}}"
          REQUIRED_BRANCH="${WORKFLOW_DEPLOY_BRANCH:-${TWINEVIA_DEPLOY_BRANCH:-${LEGACY_BETA_DEPLOY_BRANCH:-main}}}"
          REQUIRED_TRACKING="${WORKFLOW_DEPLOY_TRACKING:-${TWINEVIA_DEPLOY_TRACKING:-${LEGACY_BETA_DEPLOY_TRACKING:-origin/${REQUIRED_BRANCH}}}}"
          SSH_TARGET_VALUE="${TWINEVIA_SSH_TARGET:-}"

          if [ -z "${WORKFLOW_DEPLOY_BRANCH:-}" ] && [ -z "${TWINEVIA_DEPLOY_BRANCH:-}" ] && [ -n "${LEGACY_BETA_DEPLOY_BRANCH:-}" ]; then
            echo "::warning::BETA_DEPLOY_BRANCH is deprecated; use TWINEVIA_DEPLOY_BRANCH."
          fi
          if [ -z "${WORKFLOW_DEPLOY_TRACKING:-}" ] && [ -z "${TWINEVIA_DEPLOY_TRACKING:-}" ] && [ -n "${LEGACY_BETA_DEPLOY_TRACKING:-}" ]; then
            echo "::warning::BETA_DEPLOY_TRACKING is deprecated; use TWINEVIA_DEPLOY_TRACKING."
          fi

          if [ -z "${SSH_TARGET_VALUE}" ]; then
            if [ -n "${PILOT_VPS_HOST:-}" ] && [ -n "${VPS_USER_VALUE}" ]; then
              echo "::warning::PILOT_VPS_HOST/PILOT_VPS_USER are deprecated; use TWINEVIA_SSH_TARGET."
              SSH_TARGET_VALUE="${VPS_USER_VALUE}@${PILOT_VPS_HOST}"
            else
              echo "❌ missing TWINEVIA_SSH_TARGET (or legacy fallback host/user secrets)"
              exit 1
            fi
          fi

          echo "==> Production deploy source"
          echo "Branch: ${REQUIRED_BRANCH}"
          echo "Tracking: ${REQUIRED_TRACKING}"
          echo "SSH target: ${SSH_TARGET_VALUE}"

          ssh -p "${VPS_PORT_VALUE}" \
            -i ~/.ssh/vps_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_TARGET_VALUE}" bash -s -- "${REQUIRED_BRANCH}" "${REQUIRED_TRACKING}" <<'REMOTE'
          set -euo pipefail

          REQUIRED_BRANCH="$1"
          REQUIRED_TRACKING="$2"
          APP_ROOT="${APP_ROOT:-}"
          APP_USER="${APP_USER:-}"
          CURRENT_UNIT_PREFIX=""
          TWINEVIA_SAAS_DBDOCTOR_BIN="/usr/local/bin/twinevia-saas-dbdoctor"
          TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN="/usr/local/bin/saas-dbdoctor"

          fail() {
            echo "❌ $1" >&2
            exit 1
          }

          resolve_app_user() {
            if [ -n "${APP_USER}" ]; then
              printf '%s\n' "${APP_USER}"
              return
            fi
            if id -u twinevia >/dev/null 2>&1; then
              printf 'twinevia\n'
              return
            fi
            if id -u smsadmin >/dev/null 2>&1; then
              printf 'smsadmin\n'
              return
            fi
            printf 'twinevia\n'
          }

          resolve_app_root() {
            local active_root
            if [ -n "${APP_ROOT}" ]; then
              printf '%s\n' "${APP_ROOT}"
              return
            fi
            active_root="$(systemctl show twinevia-saas.service -p WorkingDirectory --value 2>/dev/null || true)"
            if [ -n "${active_root}" ] && [ -d "${active_root}/.git" ]; then
              printf '%s\n' "${active_root}"
              return
            fi
            active_root="$(systemctl show sms-saas.service -p WorkingDirectory --value 2>/dev/null || true)"
            if [ -n "${active_root}" ] && [ -d "${active_root}/.git" ]; then
              printf '%s\n' "${active_root}"
              return
            fi
            if [ -d /opt/twinevia-saas/.git ]; then
              printf '/opt/twinevia-saas\n'
              return
            fi
            if [ -d /opt/sms-saas/.git ]; then
              printf '/opt/sms-saas\n'
              return
            fi
            printf '/opt/twinevia-saas\n'
          }

          resolve_runtime_prefix() {
            if systemctl list-unit-files twinevia-saas.service --no-legend | grep -q '^twinevia-saas.service[[:space:]]'; then
              printf 'twinevia-saas\n'
              return
            fi
            if systemctl list-unit-files sms-saas.service --no-legend | grep -q '^sms-saas.service[[:space:]]'; then
              printf 'sms-saas\n'
              return
            fi
            printf 'twinevia-saas\n'
          }

          resolve_health_host() {
            local trusted_hosts
            local first_host

            trusted_hosts="$(sudo grep -E '^TRUSTED_HOSTS=' "${APP_ROOT}/.env" | tail -n1 | cut -d= -f2- || true)"
            first_host="$(printf '%s' "${trusted_hosts}" | awk -F',' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}')"
            if [ -n "${first_host}" ]; then
              printf '%s\n' "${first_host}"
              return
            fi
            printf '127.0.0.1\n'
          }

          echo "==> Production preflight"
          APP_ROOT="$(resolve_app_root)"
          APP_USER="$(resolve_app_user)"
          CURRENT_UNIT_PREFIX="$(resolve_runtime_prefix)"
          [ -d "${APP_ROOT}" ] || fail "${APP_ROOT} does not exist. Run deploy/install_saas.sh manually first."
          [ -f "${APP_ROOT}/.env" ] || fail "${APP_ROOT}/.env is missing."
          sudo -u "${APP_USER}" test -d "${APP_ROOT}/.git" || fail "${APP_ROOT} is not a git checkout."
          sudo -u "${APP_USER}" git -C "${APP_ROOT}" diff --quiet || fail "${APP_ROOT} has uncommitted tracked changes."
          sudo -u "${APP_USER}" git -C "${APP_ROOT}" diff --cached --quiet || fail "${APP_ROOT} has staged changes."

          CURRENT_BRANCH="$(sudo -u "${APP_USER}" git -C "${APP_ROOT}" rev-parse --abbrev-ref HEAD)"
          [ "${CURRENT_BRANCH}" = "${REQUIRED_BRANCH}" ] || fail "${APP_ROOT} is on ${CURRENT_BRANCH}, expected ${REQUIRED_BRANCH}."

          TRACKING_BRANCH="$(sudo -u "${APP_USER}" git -C "${APP_ROOT}" rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
          [ "${TRACKING_BRANCH}" = "${REQUIRED_TRACKING}" ] || fail "${APP_ROOT} tracks ${TRACKING_BRANCH:-<none>}, expected ${REQUIRED_TRACKING}."

          if [ -x "${TWINEVIA_SAAS_DBDOCTOR_BIN}" ]; then
            ACTIVE_DBDOCTOR_BIN="${TWINEVIA_SAAS_DBDOCTOR_BIN}"
          elif [ -x "${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}" ]; then
            ACTIVE_DBDOCTOR_BIN="${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}"
          else
            fail "${TWINEVIA_SAAS_DBDOCTOR_BIN} is missing. Run deploy/install_saas.sh manually first."
          fi

          for unit in \
            "${CURRENT_UNIT_PREFIX}.service" \
            "${CURRENT_UNIT_PREFIX}-worker.service" \
            "${CURRENT_UNIT_PREFIX}-scheduler.timer" \
            "${CURRENT_UNIT_PREFIX}-billing-reconcile.timer" \
            "${CURRENT_UNIT_PREFIX}-platform-restart-queue.timer" \
            "${CURRENT_UNIT_PREFIX}-a2p-reconcile.timer"; do
            systemctl list-unit-files "${unit}" --no-legend | grep -q "^${unit}[[:space:]]" || fail "Missing systemd unit ${unit}. Run deploy/install_saas.sh manually first."
          done

          for key in \
            DATABASE_URL \
            SAAS_BASE_URL \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET \
            STRIPE_PRICE_ID \
            TWILIO_ACCOUNT_SID \
            TWILIO_AUTH_TOKEN \
            TWILIO_CREDENTIAL_ENCRYPTION_KEY \
            SECRET_KEY \
            TRUSTED_HOSTS; do
            sudo grep -q "^${key}=" "${APP_ROOT}/.env" || fail "Missing ${key} in ${APP_ROOT}/.env"
          done

          sudo -u "${APP_USER}" bash -lc "set -euo pipefail; cd \"${APP_ROOT}\"; set -a; source .env; set +a; \"${ACTIVE_DBDOCTOR_BIN}\" --doctor" >/dev/null

          echo "==> Refresh deploy tooling from repo"
          sudo -u "${APP_USER}" bash -lc "cd \"${APP_ROOT}\" && git pull --ff-only"
          sudo install -m 0755 "${APP_ROOT}/deploy/deploy_twinevia_saas.sh" /usr/local/bin/deploy_twinevia_saas.sh
          sudo install -m 0755 "${APP_ROOT}/bin/twinevia-saas-dbdoctor" "${TWINEVIA_SAAS_DBDOCTOR_BIN}"
          sudo install -m 0755 "${APP_ROOT}/bin/saas-dbdoctor" "${TWINEVIA_SAAS_DBDOCTOR_ALIAS_BIN}"

          echo "==> Deploy latest branch"
          sudo EXPECTED_GIT_BRANCH="${REQUIRED_BRANCH}" EXPECTED_GIT_TRACKING_BRANCH="${REQUIRED_TRACKING}" APP_ROOT="${APP_ROOT}" APP_USER="${APP_USER}" /usr/local/bin/deploy_twinevia_saas.sh

          echo "==> Service assertions"
          sudo systemctl is-active --quiet twinevia-saas
          sudo systemctl is-active --quiet twinevia-saas-worker
          sudo systemctl is-active --quiet twinevia-saas-scheduler.timer
          sudo systemctl is-active --quiet twinevia-saas-billing-reconcile.timer
          sudo systemctl is-active --quiet twinevia-saas-platform-restart-queue.timer
          sudo systemctl is-active --quiet twinevia-saas-a2p-reconcile.timer

          echo "==> Restart helper smoke check"
          sudo -u "${APP_USER}" sudo -n /usr/local/bin/restart-twinevia-saas-services --check >/dev/null

          echo "==> Health check"
          HEALTH_HOST="$(resolve_health_host)"
          curl -fsS --connect-timeout 2 --max-time 5 -H "Host: ${HEALTH_HOST}" http://127.0.0.1:8100/health >/dev/null

          echo "✅ Twinevia production deploy complete and healthy"
          REMOTE
