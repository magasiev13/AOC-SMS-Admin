name: Tests (Python 3.11)

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run baseline quality gate
        run: |
          ./run/verify.sh

      - name: Bootstrap project venv
        run: |
          ./run/setup.sh

      - name: Run documented CLI smoke checks
        run: |
          ./run/doc_smoke.sh

      - name: Run test suite
        run: |
          ./run/test.sh -q
