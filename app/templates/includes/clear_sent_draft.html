{% set sent_draft_key = session.get('clear_send_draft_key') %}
{% if sent_draft_key %}
<script data-draft-key="{{ sent_draft_key }}" src="{{ url_for('static', filename='js/pages/includes-clear-sent-draft.js', v=app_version) }}"></script>
{% set consumed_sent_draft_key = session.pop('clear_send_draft_key', None) %}
{% endif %}
