<nav class="directory-views" aria-label="Contact Views">
    {% for value, label in [('contactable','Contactable'),('all','All Contacts'),('opted_out','Opted out'),('blocked','Restriction records')] %}
    <a href="{{ url_for('main.unsubscribed_list', search=search) if value == 'blocked' else url_for('main.community_list', view=value, search=search) }}"{% if audience_view == value %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
    {% if can_view_contact_numbers and current_user.is_admin and config.SAAS_MODE %}
    <a href="{{ url_for('main.community_delivery_review') }}"{% if audience_view == 'review' %} aria-current="page"{% endif %}>Delivery review</a>
    {% endif %}
</nav>
