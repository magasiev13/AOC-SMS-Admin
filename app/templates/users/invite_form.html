{% extends "base.html" %}

{% block title %}Invite Team Member - SMS Admin{% endblock %}

{% block page_title %}Invite Team Member{% endblock %}

{% block breadcrumbs %}
<a href="{{ url_for('main.dashboard') }}">Dashboard</a> /
<a href="{{ url_for('main.users_list') }}">Users</a> /
<span>Invite</span>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card app-card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" required placeholder="staff@example.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="role">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="social_manager">Staff</option>
                            <option value="admin">Owner</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Create Invitation</button>
                        <a href="{{ url_for('main.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
