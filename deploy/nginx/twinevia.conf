upstream twinevia_saas_app {
    server 127.0.0.1:8100;
    keepalive 16;
}

# Stylesheet-relative fonts and images have no release query. Revalidate those
# after a short cache lifetime; only versioned asset URLs are immutable.
map $arg_v $twinevia_static_cache_control {
    "" "public, max-age=300, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name twinevia.com www.twinevia.com app.twinevia.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twinevia.com www.twinevia.com;

    ssl_certificate /etc/letsencrypt/live/twinevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinevia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TwineviaTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    # Public release assets bypass the application workers. Generated asset
    # URLs carry the release id; unversioned references use the short policy.
    location ^~ /static/ {
        alias /opt/twinevia-saas/current/app/static/;
        autoindex off;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;
        add_header Cache-Control $twinevia_static_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /ready {
        return 404;
    }

    # These paths remain reverse-proxied on www so previously issued provider,
    # invitation, compliance, and Checkout callback URLs keep working.
    location ~ ^/(webhooks/|invites/|compliance/|billing(?:/|$)|setup(?:/|$)) {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://twinevia_saas_app;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://twinevia_saas_app;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.twinevia.com;

    ssl_certificate /etc/letsencrypt/live/twinevia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twinevia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TwineviaTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    location ^~ /static/ {
        alias /opt/twinevia-saas/current/app/static/;
        autoindex off;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml;
        add_header Cache-Control $twinevia_static_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://twinevia_saas_app;
    }
}
